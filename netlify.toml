[build]
  command = "npm run build"
  publish = ".next"

# Preview and branch hosts stay hidden from search. Production uses the
# approved origin in src/content/seo.ts (D-017 / ODR-024).
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
